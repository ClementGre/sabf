services:
  postgres:
    image: postgres:18-alpine
    container_name: sabf-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sabf
      POSTGRES_USER: sabf
      POSTGRES_PASSWORD: sabf
    restart: always
    volumes:
      - ./data/postgres:/var/lib/postgresql

  sabf:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: sabf
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: postgres://sabf:sabf@postgres:5432/sabf?sslmode=disable
      JWT_SECRET: change-me-to-a-long-random-string
      CORS_ALLOWED_ORIGINS: '*'
    restart: always
    depends_on:
      - postgres

  front_demo:
    build:
      context: ./example/vuejs-front
      dockerfile: Dockerfile
    container_name: sabf-front-demo
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "80:80"
    restart: always
